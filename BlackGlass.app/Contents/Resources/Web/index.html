<!DOCTYPE html>
<html lang="en" data-theme="system">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#1c1c1e">
  <title>BlackGlass</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cpath fill='%230a84ff' d='M12 1.5C12 1.5 3.5 12.6 3.5 18a8.5 8.5 0 0 0 17 0C20.5 12.6 12 1.5 12 1.5Z'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="ofm.css">
  <!-- Fetched without blocking first paint. This is the one render-blocking
       resource that isn't served by the app itself, so on a LAN with no route
       out it held the page blank until the request timed out — and it only
       matters once a note renders math, which needs the KaTeX script from the
       same CDN anyway. -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css" media="print" onload="this.media='all'">
</head>
<body>
  <div id="app">
    <div class="scrim" id="scrim" hidden></div>
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-glass"></div>
      <div class="tree scrollable" id="tree"></div>
      <div class="search-bar" id="searchBar" hidden>
        <span class="search-icon" data-icon="search"></span>
        <input id="searchInput" type="search" placeholder="Search notes" enterkeyhint="search" autocomplete="off">
        <button type="button" id="searchClose" class="icon-btn" aria-label="Close search" data-icon="xmark-circle"></button>
      </div>
      <div class="bottom-bar">
        <button type="button" id="themeBtn" class="icon-btn" title="Appearance: Auto" data-icon="auto"></button>
        <button type="button" id="vaultBtn" class="vault-btn" title="Switch vault">
          <span data-icon="vault"></span>
          <span id="vaultName">Notebook</span>
          <span data-icon="chevrons" class="vault-chevrons"></span>
        </button>
        <div class="bottom-icons">
          <button type="button" id="newBtn" class="icon-btn" title="New note" data-icon="compose"></button>
          <button type="button" id="refreshBtn" class="icon-btn" title="Refresh" data-icon="refresh"></button>
          <button type="button" id="searchToggle" class="icon-btn" title="Search" data-icon="search"></button>
          <button type="button" id="graphBtn" class="icon-btn" title="Graph" data-icon="graph"></button>
        </div>
      </div>
      <div class="vault-menu" id="vaultMenu" hidden></div>
      <div class="sidebar-resizer" id="sidebarResizer"></div>
    </aside>
    <main class="editor" id="editorPane">
      <header class="editor-header">
        <button type="button" id="menuBtn" class="icon-btn menu-btn" aria-label="Hide sidebar" title="Hide sidebar" data-icon="sidebar"></button>
        <div class="title" id="noteTitle">Select a note</div>
        <button type="button" id="eggBtn" class="egg" data-mode="uncooked" title="Uncooked — raw text" aria-label="Toggle cooked">
          <svg id="eggSvg" viewBox="0 0 24 24" width="18" height="18"></svg>
        </button>
      </header>
      <div class="editor-body">
        <textarea id="rawEditor" class="scrollable" spellcheck="false" placeholder="Select a note or create one"></textarea>
        <div id="cookedView" class="cooked scrollable" hidden></div>
      </div>
    </main>
  </div>

  <div id="omnibar" class="omnibar" hidden>
    <div class="omnibar-card">
      <div class="omnibar-row">
        <span class="search-icon" data-icon="search"></span>
        <input id="omniInput" type="search" placeholder="Search all notes or jump to file…" autocomplete="off">
      </div>
      <div id="omniResults" class="omni-results scrollable"></div>
    </div>
  </div>

  <div id="ctxMenu" class="ctx-menu" hidden></div>
  <div id="sheet" class="sheet" hidden>
    <div class="sheet-card" id="sheetCard"></div>
  </div>

  <div id="graph" class="graph" hidden>
    <canvas id="graphCanvas"></canvas>
  </div>

  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
